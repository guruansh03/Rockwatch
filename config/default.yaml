# RockWatch-FuseGuard tunables. Frozen copy goes into every report.
paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  cache: data/cache
  docs: docs
  reports: reports

inventory:
  sciencebase_item: "https://www.sciencebase.gov/catalog/item/671eef1fd34ed0f827ea9f12?format=json"
  raw_dir: data/raw/usgs_ls_v3
  c_min: 3                 # confidence filter; also report >=5
  c_alt: 5
  short_range_max_days: 3  # Date_Max - Date_Min <= this -> short_range
  min_year: 1950           # ERA5 from 1940; 30-day antecedent needed
  max_valid_date: "2025-12-31"  # dates after this -> invalid (treated as undated; counted)
  utc_inventories:         # dates in UTC; all others local time
    - "USGS Earthquake-Triggered Ground Failure"
    - "USGS Seismogenic Mass Movements"
  # LS_Type lowercase substrings -> dropped as non-landslide. Checked before family map.
  exclude_type_substrings:
    - "gully"
    - "avalanche chute"
    - "snow avalanche"
    - "sinkhole"
    - "subsidence"
    - "erosion"
    - "manmade fill"
  # LS_Type lowercase substring -> type_family. First match in this order wins.
  type_family_map:
    - [fall, ["rockfall", "rock fall", "rock-fall", "rock_fall", "fall", "topple", "rock avalanche", "rock and ice avalanche"]]
    - [flow, ["debris flow", "debris_flow", "mudflow", "mud flow", "mudslide", "earthflow", "earth flow", "flow", "torrent", "lahar", "debris avalanche"]]
    - [slide, ["slide", "slump", "rotational", "translational"]]
    - [unknown, ["unknown", "undetermined", "unspecified", "landslide", "mass movement"]]
  other_family: other       # nonempty LS_Type with no match
  empty_family: unknown     # missing LS_Type

profiling:
  zone_deg: 0.25            # matches ERA5 order of magnitude
  candidate_windows_deg: [2.0, 3.0]
  window_step_deg: 0.5
  top_k_regions: 10
  rank_by: pos_zone_days_no_eq  # EQ-triggered inventories = few huge single days (D-009)
  min_positive_zone_days: 150   # heuristic (DECISIONS.md)
  min_test_zone_days: 30
  split_fracs: [0.6, 0.2, 0.2]  # train/val/test by positive zone-day count, chronological
  gap_days: 30

yosemite:
  index_url: "https://pubs.usgs.gov/ds/746/"
  raw_dir: data/raw/yosemite

# ---- CP1 decisions (2026-10-29, confirmed by user). Frozen: change only with a DECISIONS entry.
main_region: A
regions:
  A:
    name: "Anchorage / Seward Highway, Alaska (AK DOT)"
    tz: America/Anchorage
    truth: usgs_v3
    bbox: [59.5, 62.5, -150.5, -147.5]     # lat0, lat1, lon0, lon1 (half-open)
    exclude_eq_inventories_from_positives: false   # main P/R includes them; breakdown without
    splits:
      train: ["2006-01-01", "2015-02-10"]
      val:   ["2015-03-13", "2018-03-15"]
      test:  ["2018-04-15", "2022-06-30"]
  Y:
    name: "Yosemite Valley, California (USGS DS746 rockfall track)"
    tz: America/Los_Angeles
    truth: yosemite_ds746
    single_zone: {zone_id: "yose", lat: 37.735, lon: -119.590}   # no coords in DS746
    splits:
      train: ["1951-01-01", "2008-01-08"]
      val:   ["2008-02-08", "2010-04-03"]
      test:  ["2010-05-04", "2011-12-31"]
# Region B (Puget Sound/NW Oregon) dropped: Open-Meteo free quota infeasible (D-014).

zones:
  deg: 0.25
  zero_feature_ratio: 0.25    # zero-feature cells sampled = ratio x feature cells
  zero_feature_neighbor_only: true   # sample from 8-neighbours of feature cells (likely land)
  seed: 25071
  antecedent_days: 35         # weather fetched from train start - this

weather:
  base_url: "https://archive-api.open-meteo.com/v1/archive"
  daily: [precipitation_sum, rain_sum, snowfall_sum, precipitation_hours, temperature_2m_max, temperature_2m_min]
  chunk_years: 17           # one request per zone if range fits; single request must stay < minutely quota
  min_interval_s: 22        # pacing between requests (minutely quota ~600 weighted; ~150-260 per 16-yr request)
  timeout_s: 60

quakes:
  base_url: "https://earthquake.usgs.gov/fdsnws/event/1/query"
  min_magnitude: 3.0
  buffer_km: 200

llm:
  provider: mock
  temperature: 0
  timeout_s: 20
  max_tool_turns: 4
  max_llm_calls: 500
  groq:                     # Groq free tier (D-058): ~30 req/min, 8K tokens/min, 200K tokens/day per model
    verifier: openai/gpt-oss-20b
    writer: openai/gpt-oss-120b
    min_interval_s_batch: 7.5   # pacing for eval/smoke so ~1K-token calls stay under 8K tokens/min
    max_llm_calls: 80           # per region and run (highest-p first): 2 x 80 x ~900 tokens stays under 200K tokens/day
  prices: null              # never hardcoded

fusion:
  neg_per_pos: 50           # negatives sampled per positive (all positives kept); actual ratio recorded
  C_grid: [0.01, 0.1, 1.0]  # L2 strength chosen by val average precision
  cap: 3.0                  # per-modality contribution clip (log-odds)
  seed: 25071
  quality_weights: {ok: 1.0, degraded: 0.5, missing: 0.0}
  dynamic_modalities: [rain, thermal, seismic]

thresholds:
  t2_rule: f1_day           # CP2 (user, 2026-10-30): F1 with day-level precision (D-049). Alternative: f1_episode (spec §8 as written).
  t1_recall: 0.9            # L1: largest t with val recall_at >= 0.9
  t3_min_recall: 0.2        # L3: max precision with recall >= 0.2 AND corroboration
  n_grid: 200
  corroboration_min_dynamic: 2

eval:
  level_main: 2
  bootstrap_n: 1000
  storm_gap_days: 3
  random_baseline_draws: 20
  clim_smoothing_k: 30
  banner: "US natural-slope data; not mine performance; precision is a lower bound (unreported events)."

agents:
  rain_sensor_groups: 2
  watermarks:              # deadlines after a day's tick, as a fraction of `speed`; normal days close on completeness
    evidence_missing: 0.90   # evidence agent: no reading by then → quality=missing (D-029)
    quality: 0.80            # quality agent: close day, publish flags summary
    context: 1.00            # context agent: regional extent from rain evidence received
    fusion: 1.20             # fusion: fuse whatever evidence exists (degraded)
    alert: 1.50              # alert agent: close the day with the verified risks received
  stale_after_s: 6.0         # supervisor: no heartbeat → stale
  restart_after_s: 12.0      # supervisor: auto-restart (if enabled for that agent)
  ack_renotify_days: 2       # alert agent: unacked L2+ re-notified after N sim-days
  stuck_days: 4              # quality: identical Tmax & Tmin this many days → degraded
  outlier_mm: 75             # quality: P1 > max(outlier_mm, 6×neighbour median) → degraded

scenarios:
  dev_val:                   # development scenario (VALIDATION period; test scenarios chosen at CP2)
    region: A
    start: "2017-08-20"
    days: 60
  dev_val_Y:                 # Yosemite single-zone track, validation period
    region: Y
    start: "2009-03-01"
    days: 60
  # TEST-period demo scenarios approved at CP2 (D-052). Replayable only after the sealed final test evaluation exists.
  storm_A:   {region: A, start: "2018-10-12", days: 45}   # wettest 45-day window in test (CP2 packet)
  quiet_A:   {region: A, start: "2022-05-15", days: 45}   # driest 45-day window
  quake_A:   {region: A, start: "2018-11-20", days: 45}   # M7.1 Anchorage 2018-11-30 inside window
  storm_Y:   {region: Y, start: "2010-11-19", days: 45}
  quiet_Y:   {region: Y, start: "2010-05-29", days: 45}
  quake_Y:   {region: Y, start: "2011-08-14", days: 45}   # M4.23 on 2011-08-24 (<=100 km)
# (llm) live demo budget: at most this many verifier calls per sim-day (highest-p first is not guaranteed; arrival order)
llm_live:
  max_calls_per_day: 3
